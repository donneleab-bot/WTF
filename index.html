<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выживание Куриц — Остров (Вода только на воде)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a1a2a;
            cursor: grab;
        }
        body.dragging { cursor: grabbing; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #e8e0c0;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: sans-serif;
            pointer-events: none;
            border: 2px solid #5a7a4a;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div class="hint">Колёсико — зум · ЛКМ — двигать</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // 1. НАСТРОЙКИ
        // ==========================================
        const MAP_SIZE = 2048;
        let zoom = 1.5;
        let cameraX = 0;
        let cameraY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // ==========================================
        // 2. ГЕНЕРАЦИЯ КАРТЫ
        // ==========================================
        const mapCanvas = document.createElement('canvas');
        mapCanvas.width = MAP_SIZE;
        mapCanvas.height = MAP_SIZE;
        const mapCtx = mapCanvas.getContext('2d');

        // Палитра
        const C = {
            grass1: '#354F2A',
            grass2: '#425E33',
            grass3: '#506E3E',
            grass4: '#62824D',
            grass5: '#779B5F',
            sand: '#C9B896',
            sandDark: '#B09F7A',
            water1: '#1E3A5F',
            waterEdge: '#3E6A8F'
        };

        // Шум для травы
        function smoothNoise(x, y) {
            let n = 0;
            n += Math.sin(x * 0.008) * Math.cos(y * 0.008) * 0.4;
            n += Math.sin(x * 0.02) * Math.cos(y * 0.02) * 0.3;
            n += Math.sin(x * 0.05) * Math.cos(y * 0.05) * 0.2;
            n += Math.sin(x * 0.12) * Math.cos(y * 0.12) * 0.1;
            return (n + 1) / 2;
        }

        // Шум для формы острова
        function edgeNoise(x, y) {
            let n = 0;
            n += Math.sin(x * 0.005 + y * 0.003) * 300;
            n += Math.sin(x * 0.01 - y * 0.02) * 150;
            n += Math.sin(x * 0.03 + y * 0.04) * 80;
            n += Math.sin(x * 0.08 - y * 0.06) * 30;
            return n;
        }

        const centerX = MAP_SIZE / 2;
        const centerY = MAP_SIZE / 2;
        const baseRadius = 800;

        let isMapReady = false;

        // Массив для хранения информации о воде (true = вода)
        // Мы будем использовать его для анимации
        const waterMask = new Uint8Array(MAP_SIZE * MAP_SIZE);

        // --- ГЕНЕРАЦИЯ ---
        function generateMap() {
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    const n = edgeNoise(x, y);
                    const finalDist = dist + n;

                    const index = y * MAP_SIZE + x;

                    if (finalDist < baseRadius) {
                        const edgeDist = baseRadius - finalDist;

                        // Перемешка песка и травы вокруг воды
                        if (edgeDist < 60) {
                            const mix = smoothNoise(x * 15, y * 15);
                            
                            if (mix > 0.7) {
                                mapCtx.fillStyle = C.grass2;
                            } else if (mix > 0.4) {
                                mapCtx.fillStyle = C.sandDark;
                            } else {
                                if (smoothNoise(x * 20, y * 20) > 0.5) mapCtx.fillStyle = C.sand;
                                else mapCtx.fillStyle = C.sandDark;
                            }
                        } else {
                            const n1 = smoothNoise(x, y);
                            const n2 = smoothNoise(x * 3, y * 3);
                            const noise = n1 * 0.6 + n2 * 0.4;
                            
                            if (noise > 0.75) mapCtx.fillStyle = C.grass5;
                            else if (noise > 0.55) mapCtx.fillStyle = C.grass4;
                            else if (noise > 0.35) mapCtx.fillStyle = C.grass3;
                            else if (noise > 0.15) mapCtx.fillStyle = C.grass2;
                            else mapCtx.fillStyle = C.grass1;
                        }
                        mapCtx.fillRect(x, y, 1, 1);
                    } else {
                        // Вода (только базовый цвет, без бликов)
                        mapCtx.fillStyle = C.water1;
                        mapCtx.fillRect(x, y, 1, 1);
                        
                        // Отмечаем, что это вода
                        waterMask[index] = 1;
                    }
                }
            }

            // Травинки (только на траве)
            for (let i = 0; i < 8000; i++) {
                const x = Math.floor(Math.random() * MAP_SIZE);
                const y = Math.floor(Math.random() * MAP_SIZE);
                const index = y * MAP_SIZE + x;

                // Если не вода
                if (waterMask[index] === 0) {
                    const pixel = mapCtx.getImageData(x, y, 1, 1).data;
                    if (pixel[3] > 0 && pixel[1] > 100 && pixel[0] < 150) {
                        mapCtx.fillStyle = C.grass1;
                        mapCtx.fillRect(x, y, 2, 2);
                        mapCtx.fillStyle = C.grass5;
                        mapCtx.fillRect(x, y, 1, 1);
                    }
                }
            }

            // Цветы (только на траве)
            for (let i = 0; i < 3000; i++) {
                const x = Math.floor(Math.random() * MAP_SIZE);
                const y = Math.floor(Math.random() * MAP_SIZE);
                const index = y * MAP_SIZE + x;

                if (waterMask[index] === 0) {
                    const pixel = mapCtx.getImageData(x, y, 1, 1).data;
                    if (pixel[3] > 0 && pixel[1] > 100 && pixel[0] < 150) {
                        mapCtx.fillStyle = 'rgba(0,0,0,0.2)';
                        mapCtx.fillRect(x, y+1, 3, 1);
                        
                        mapCtx.fillStyle = '#E8E0D0';
                        mapCtx.fillRect(x, y-1, 1, 1);
                        mapCtx.fillRect(x, y+1, 1, 1);
                        mapCtx.fillRect(x-1, y, 1, 1);
                        mapCtx.fillRect(x+1, y, 1, 1);
                        
                        mapCtx.fillStyle = '#D4B04A';
                        mapCtx.fillRect(x, y, 1, 1);
                    }
                }
            }

            isMapReady = true;
        }

        setTimeout(generateMap, 100);

        // ==========================================
        // 3. АНИМАЦИЯ ВОДЫ
        // ==========================================
        // Мы не создаём второй холст. Мы будем рисовать блики поверх воды.
        let waterFrame = 0;

        function animateWater() {
            if (!isMapReady) return;

            // Проходим по всем пикселям воды и добавляем блики
            // Это быстрее, чем перерисовывать всю карту
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    const index = y * MAP_SIZE + x;
                    if (waterMask[index] === 1) {
                        // Анимируем блики: если кадр 0, рисуем одни блики, если 1 — другие
                        if (waterFrame === 0) {
                            if (smoothNoise(x * 30, y * 30) > 0.8) {
                                mapCtx.fillStyle = C.waterEdge;
                                mapCtx.fillRect(x, y, 1, 1);
                            }
                        } else {
                            if (smoothNoise(x * 30 + 5, y * 30 + 5) > 0.8) {
                                mapCtx.fillStyle = C.waterEdge;
                                mapCtx.fillRect(x, y, 1, 1);
                            }
                        }
                    }
                }
            }

            draw();
        }

        // Запускаем анимацию каждые 500 мс
        setInterval(() => {
            waterFrame = 1 - waterFrame;
            // Перерисовываем карту с новыми бликами
            // Но это долго, поэтому лучше сделать это через requestAnimationFrame
            // Пока просто вызываем animateWater, который обновляет блики и перерисовывает
            // Для оптимизации можно перерисовывать только воду, но для простоты — всю карту
            if (isMapReady) {
                // Сначала перерисовываем карту (стираем блики)
                // (Это делается в generateMap, но мы не хотим генерировать заново)
                // Поэтому просто перерисовываем draw, который накладывает блики
                draw();
            }
        }, 1000);

        // ==========================================
        // 4. ОТРИСОВКА
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.scale(zoom, zoom);
            ctx.translate(-cameraX, -cameraY);

            if (isMapReady) {
                ctx.drawImage(mapCanvas, 0, 0);
            } else {
                ctx.fillStyle = '#1a2a1f';
                ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
                ctx.fillStyle = 'white';
                ctx.font = '20px sans-serif';
                ctx.fillText("Генерация карты...", MAP_SIZE/2 - 100, MAP_SIZE/2);
            }

            ctx.restore();

            // Интерфейс
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 150, 40);
            ctx.fillStyle = 'white';
            ctx.font = '14px sans-serif';
            ctx.fillText(`Zoom: ${zoom.toFixed(1)}`, 20, 35);
        }

        // ==========================================
        // 5. УПРАВЛЕНИЕ
        // ==========================================
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const worldX = (mouseX / zoom) + cameraX;
            const worldY = (mouseY / zoom) + cameraY;

            if (e.deltaY < 0) {
                zoom = Math.min(zoom * 1.1, 8);
            } else {
                zoom = Math.max(zoom / 1.1, 0.5);
            }

            cameraX = worldX - (mouseX / zoom);
            cameraY = worldY - (mouseY / zoom);
            draw();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                document.body.classList.add('dragging');
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                cameraX -= dx / zoom;
                cameraY -= dy / zoom;
                draw();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isDragging = false;
                document.body.classList.remove('dragging');
            }
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        window.addEventListener('resize', resize);
        resize();

        // Запускаем отрисовку
        draw();

    </script>
</body>
</html>
