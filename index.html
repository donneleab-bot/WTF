<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выживание Куриц — Гигантский Остров (Плавный переход)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0d1b2a;
            cursor: grab;
        }
        body.dragging { cursor: grabbing; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #e8e0c0;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: sans-serif;
            pointer-events: none;
            border: 2px solid #5a7a4a;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div class="hint">Колёсико — зум · ЛКМ — двигать</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // 1. НАСТРОЙКИ
        // ==========================================
        const MAP_SIZE = 2048;
        let zoom = 1.5;
        let cameraX = 0;
        let cameraY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // ==========================================
        // 2. ГЕНЕРАЦИЯ КАРТЫ
        // ==========================================
        const mapCanvas = document.createElement('canvas');
        mapCanvas.width = MAP_SIZE;
        mapCanvas.height = MAP_SIZE;
        const mapCtx = mapCanvas.getContext('2d');

        // Природная палитра
        const C = {
            grass1: '#3E5C2B', // Тёмная трава (тень)
            grass2: '#4E6E36', // Средне-тёмная
            grass3: '#5F8244', // Основная
            grass4: '#769B56', // Светлая
            grass5: '#8DB36A', // Блик
            sand: '#D9C49A',   // Песок
            sandDark: '#BFA87A' // Тень на песке
        };

        // --- УЛУЧШЕННЫЙ ШУМ (Плавный переход) ---
        // Используем фрактальный шум с интерполяцией
        function smoothNoise(x, y) {
            // Много октав с разными частотами для естественности
            let n = 0;
            n += Math.sin(x * 0.008) * Math.cos(y * 0.008) * 0.4;
            n += Math.sin(x * 0.02) * Math.cos(y * 0.02) * 0.3;
            n += Math.sin(x * 0.05) * Math.cos(y * 0.05) * 0.2;
            n += Math.sin(x * 0.12) * Math.cos(y * 0.12) * 0.1;
            return (n + 1) / 2; // 0..1
        }

        const centerX = MAP_SIZE / 2;
        const centerY = MAP_SIZE / 2;
        const baseRadius = 800;

        // --- ГЕНЕРАЦИЯ ОСТРОВА ---
        for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
                const dx = x - centerX;
                const dy = y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Рваные края (оставляем как было)
                const edgeNoise = smoothNoise(x * 3, y * 3) * 150 - 75;
                const finalDist = dist + edgeNoise;

                if (finalDist < baseRadius) {
                    const edgeDist = baseRadius - finalDist;

                    if (edgeDist < 40) {
                        // ПЕСОК (не трогаем)
                        if (smoothNoise(x * 20, y * 20) > 0.5) mapCtx.fillStyle = C.sand;
                        else mapCtx.fillStyle = C.sandDark;
                    } else {
                        // ТРАВА (ПЛАВНЫЙ ПЕРЕХОД)
                        // Используем два слоя шума для мягких переходов
                        const n1 = smoothNoise(x, y);
                        const n2 = smoothNoise(x * 2, y * 2); // Второй слой для детализации
                        
                        // Смешиваем: базовый шум + мелкие детали
                        const n = n1 * 0.7 + n2 * 0.3;
                        
                        if (n > 0.8) mapCtx.fillStyle = C.grass5;
                        else if (n > 0.6) mapCtx.fillStyle = C.grass4;
                        else if (n > 0.4) mapCtx.fillStyle = C.grass3;
                        else if (n > 0.2) mapCtx.fillStyle = C.grass2;
                        else mapCtx.fillStyle = C.grass1;
                    }
                    mapCtx.fillRect(x, y, 1, 1);
                }
            }
        }

        // --- ТЕКСТУРА (Травинки) ---
        for (let i = 0; i < 10000; i++) {
            const x = Math.floor(Math.random() * MAP_SIZE);
            const y = Math.floor(Math.random() * MAP_SIZE);
            
            const pixel = mapCtx.getImageData(x, y, 1, 1).data;
            if (pixel[3] > 0 && pixel[1] > 100 && pixel[0] < 150) {
                mapCtx.fillStyle = C.grass1;
                mapCtx.fillRect(x, y, 2, 2);
                mapCtx.fillStyle = C.grass5;
                mapCtx.fillRect(x, y, 1, 1);
            }
        }

        // --- ЦВЕТЫ ---
        for (let i = 0; i < 3000; i++) {
            const x = Math.floor(Math.random() * MAP_SIZE);
            const y = Math.floor(Math.random() * MAP_SIZE);
            
            const pixel = mapCtx.getImageData(x, y, 1, 1).data;
            if (pixel[3] > 0 && pixel[1] > 100 && pixel[0] < 150) {
                mapCtx.fillStyle = 'rgba(0,0,0,0.2)';
                mapCtx.fillRect(x, y+1, 3, 1);
                
                mapCtx.fillStyle = '#FFFFFF';
                mapCtx.fillRect(x, y-1, 1, 1);
                mapCtx.fillRect(x, y+1, 1, 1);
                mapCtx.fillRect(x-1, y, 1, 1);
                mapCtx.fillRect(x+1, y, 1, 1);
                
                mapCtx.fillStyle = '#FFD700';
                mapCtx.fillRect(x, y, 1, 1);
            }
        }

        // ==========================================
        // 3. ОТРИСОВКА
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.scale(zoom, zoom);
            ctx.translate(-cameraX, -cameraY);

            ctx.drawImage(mapCanvas, 0, 0);

            ctx.restore();

            // Интерфейс
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 150, 40);
            ctx.fillStyle = 'white';
            ctx.font = '14px sans-serif';
            ctx.fillText(`Zoom: ${zoom.toFixed(1)}`, 20, 35);
        }

        // ==========================================
        // 4. УПРАВЛЕНИЕ
        // ==========================================
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const worldX = (mouseX / zoom) + cameraX;
            const worldY = (mouseY / zoom) + cameraY;

            if (e.deltaY < 0) {
                zoom = Math.min(zoom * 1.1, 8);
            } else {
                zoom = Math.max(zoom / 1.1, 0.2);
            }

            cameraX = worldX - (mouseX / zoom);
            cameraY = worldY - (mouseY / zoom);
            draw();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                document.body.classList.add('dragging');
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                cameraX -= dx / zoom;
                cameraY -= dy / zoom;
                draw();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isDragging = false;
                document.body.classList.remove('dragging');
            }
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        window.addEventListener('resize', resize);
        resize();

    </script>
</body>
</html>
